# 项目级 DSH 配置片段。绝不包含凭据；模型凭据由用户在隔离 HOME 中配置。
- insert:
    - id: cae-viewer-mcp
      name: '@cae-agent/dsh-cae-viewer-mcp'
      config:
        serverName: cae
        transport: stdio
        command: !!js process.env.CAE_AGENT_PYTHON
        args: [!!js process.env.CAE_AGENT_MCP_SCRIPT]
        cwd: !!js process.env.CAE_AGENT_MCP_CWD
        env:
          CAE_AGENT_API_URL: !!js process.env.CAE_AGENT_API_URL
          CAE_AGENT_MCP_CWD: !!js process.env.CAE_AGENT_MCP_CWD
          PYTHONUTF8: '1'
        toolCallTimeoutMs: 1800000
        failOnStartupError: true
    - id: mcp-cae-kb
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: cae_kb
        transport: stdio
        command: !!js process.env.CAE_KB_PYTHON
        args: [!!js process.env.CAE_KB_MCP_SCRIPT]
        cwd: !!js process.env.CAE_KB_ROOT
        env:
          PYTHONUTF8: '1'
        failOnStartupError: true
        toolCallTimeoutMs: 30000
